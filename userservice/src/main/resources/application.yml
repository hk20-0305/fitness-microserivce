spring:
  application:
    name: user-service
  config:
    import: configserver:${CONFIG_SERVER_URL:https://fitness-microserivce-1.onrender.com}

# JWT configuration
# In production: set the JWT_SECRET environment variable to a strong random secret (>=32 bytes).
# The fallback value below is for LOCAL DEVELOPMENT ONLY — do not use in production.
jwt:
  secret: "${JWT_SECRET}"
  expirationSeconds: 3600

# Actuator — expose only /actuator/health for public health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never