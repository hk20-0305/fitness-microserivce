spring:
  application:
    name: api-gateway

  config:
    import: configserver:${CONFIG_SERVER_URL:https://fitness-microserivce-1.onrender.com}

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**

        - id: activity-service
          uri: lb://ACTIVITY-SERVICE
          predicates:
            - Path=/api/activities/**

        - id: ai-service
          uri: lb://AI-SERVICE
          predicates:
            - Path=/api/recommendations/**

server:
  port: ${PORT:8090}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:https://fitness-microserivce.onrender.com/eureka/}

# JWT — must match the same secret used by User Service.
# In production: set the JWT_SECRET environment variable on ALL services.
# The fallback below is for LOCAL DEVELOPMENT ONLY.
jwt:
  secret: "${JWT_SECRET}"

# Actuator — expose /actuator/health for Render health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
