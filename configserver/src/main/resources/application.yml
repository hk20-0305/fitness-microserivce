spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      enabled: false
      server:
        native:
          search-locations: classpath:/config

server:
  port: ${PORT:8888}

# Actuator — expose only /actuator/health for public health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

