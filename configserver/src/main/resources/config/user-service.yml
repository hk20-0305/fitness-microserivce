server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${AIVEN_PG_HOST}:${AIVEN_PG_PORT:5432}/fitness_user_db?sslmode=require}
    username: ${AIVEN_PG_USER:${SPRING_DATASOURCE_USERNAME}}
    password: ${AIVEN_PG_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# JWT — production MUST set JWT_SECRET env var (no fallback here)
jwt:
  secret: ${JWT_SECRET}
  expirationSeconds: ${JWT_EXPIRATION_SECONDS:3600}

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME:fitness-microserivce-2.onrender.com}
    secure-port-enabled: true
    non-secure-port-enabled: false
    secure-port: 443

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:https://fitness-microserivce.onrender.com/eureka/}
