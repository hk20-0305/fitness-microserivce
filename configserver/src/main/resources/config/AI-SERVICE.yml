spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:fitnessreco}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:true}

server:
  port: ${PORT:8083}

eureka:
  instance:
    prefer-ip-address: false
    hostname: ${RENDER_EXTERNAL_HOSTNAME}

    instance-id: ${spring.application.name}:${RENDER_EXTERNAL_HOSTNAME}:443

    secure-port: 443
    secure-port-enabled: true

    non-secure-port-enabled: false
    non-secure-port: 80

    home-page-url: https://${RENDER_EXTERNAL_HOSTNAME}/
    status-page-url: https://${RENDER_EXTERNAL_HOSTNAME}/actuator/health
    health-check-url: https://${RENDER_EXTERNAL_HOSTNAME}/actuator/health

  client:
    service-url:
      defaultZone: https://fitness-microserivce.onrender.com/eureka/

rabbitmq:
  exchange:
    name: ${RABBITMQ_EXCHANGE_NAME:fitness.exchange}
  queue:
    name: ${RABBITMQ_QUEUE_NAME:activity.queue}
  routing:
    key: ${RABBITMQ_ROUTING_KEY:activity.tracking}

gemini:
  api:
    url: ${GEMINI_API_URL}
    key: ${GEMINI_API_KEY}

# Actuator — expose only /actuator/health for public health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never


